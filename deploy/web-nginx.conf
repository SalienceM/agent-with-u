# AgentWithU — 容器内 web 层 nginx 配置
#
# 这个 nginx 跑在 awu-web 容器里，对上游只做「路径分流」：
#   /        → 静态前端（frontend/dist，已 COPY/挂载进容器）
#   /ws      → awu-backend:44321  (WebSocket)
#   /api/    → awu-backend:44322  (HTTP API：素材 / Skill 回调)
#
# 它【不】做认证——认证由最外层的 nginx-proxy-manager + Authelia 负责。
# 本层只负责把 NPM 已经盖过章（带 Remote-User 等头）的请求分发到位。

server {
    listen 80;
    server_name _;

    # 大图 base64 经 WebSocket 走，这里给 HTTP 上传也放宽一点
    client_max_body_size 64m;

    # ── 静态前端（SPA：未命中文件回退 index.html）──────────────────
    root  /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── WebSocket → 后端 44321 ──────────────────────────────────────
    location /ws {
        proxy_pass http://awu-backend:44321;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;

        # 透传 NPM/Authelia 盖的身份头给后端
        proxy_set_header Remote-User   $http_remote_user;
        proxy_set_header Remote-Email  $http_remote_email;
        proxy_set_header Remote-Name   $http_remote_name;
        proxy_set_header Remote-Groups $http_remote_groups;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── HTTP API → 后端 44322 ───────────────────────────────────────
    location /api/ {
        proxy_pass http://awu-backend:44322;
        proxy_set_header Host $host;
        proxy_set_header Remote-User  $http_remote_user;
        proxy_set_header Remote-Email $http_remote_email;
    }
}
