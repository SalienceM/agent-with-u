# AgentWithU — Docker Compose 部署示例
#
# 两个容器：
#   awu-backend  Python 后端（WS 44321 + HTTP API 44322），不直接对外
#   awu-web      nginx:alpine，托管静态前端 + 把 /ws、/api/ 分流给后端
#
# 对外只暴露 awu-web 一个口。最外层由 nginx-proxy-manager (NPM) + Authelia
# 负责 TLS 和认证 —— NPM 加一个 Proxy Host 指向 awu-web 即可。
#
# 用法：
#   cd frontend && npm run build      # 先构建出 frontend/dist
#   cd .. && docker compose -f deploy/docker-compose.example.yml up -d

services:
  awu-backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile      # 需自备，见 deploy/README.md
    image: agent-with-u-backend:latest
    container_name: awu-backend
    restart: unless-stopped

    environment:
      # forward-auth 模式：信任上游反代盖的 Remote-* 头
      AGENT_WITH_U_TRUST_FORWARD_AUTH: "1"
      AGENT_WITH_U_BIND: "0.0.0.0"        # 容器内绑 0.0.0.0，靠 docker 网络隔离
      AGENT_WITH_U_PORT: "44321"
      AGENT_WITH_U_DATA_ROOT: "/data"
      # 信任来自 docker 网络的连接（awu-web 容器）
      AGENT_WITH_U_TRUSTED_PROXIES: "172.16.0.0/12"

    volumes:
      - awu-data:/data                   # sessions / skills / asset-pool / backends
      - ~/.claude:/root/.claude:ro       # Claude 凭据（按需）

    expose:
      - "44321"
      - "44322"
    networks:
      - awu-internal

  awu-web:
    image: nginx:alpine
    container_name: awu-web
    restart: unless-stopped
    depends_on:
      - awu-backend

    volumes:
      # 构建好的前端静态产物
      - ../frontend/dist:/usr/share/nginx/html:ro
      # 容器内路径分流配置
      - ./web-nginx.conf:/etc/nginx/conf.d/default.conf:ro

    expose:
      - "80"
    networks:
      - awu-internal      # 访问 awu-backend
      - proxy             # 被 NPM 访问

volumes:
  awu-data:

networks:
  awu-internal:
    driver: bridge
  proxy:
    external: true        # 复用 nginx-proxy-manager 所在的 docker 网络
