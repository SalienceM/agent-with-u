# AgentWithU — Docker Compose 部署示例
#
# 两个容器，全部在镜像内构建，NAS 上无需装 node / 手动 build / 挂源码：
#   awu-backend  Python 后端（WS 44321 + HTTP API 44322），不直接对外
#   awu-web      多阶段构建：node 构建前端 → nginx 托管 + 路径分流
#
# awu-web 映射一个【宿主端口】，NPM 通过「NAS局域网IP : 该端口」路由进来。
# 最外层由 nginx-proxy-manager (NPM) + Authelia 负责 TLS 和认证。
#
# 用法（在仓库根目录）：
#   docker compose -f deploy/docker-compose.example.yml up -d --build

services:
  awu-backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: agent-with-u-backend:latest
    container_name: awu-backend
    restart: unless-stopped

    environment:
      # forward-auth 模式：信任上游反代盖的 Remote-* 头
      AGENT_WITH_U_TRUST_FORWARD_AUTH: "1"
      AGENT_WITH_U_BIND: "0.0.0.0"        # 容器内绑 0.0.0.0，靠 docker 网络隔离
      AGENT_WITH_U_PORT: "44321"
      AGENT_WITH_U_DATA_ROOT: "/data"
      # 信任来自 docker 网络的连接（awu-web 容器）
      AGENT_WITH_U_TRUSTED_PROXIES: "172.16.0.0/12"

    volumes:
      - awu-data:/data                   # sessions / skills / asset-pool / backends
      - ~/.claude:/root/.claude:ro       # Claude 凭据（按需）

    # 不映射宿主端口：后端只在 docker 内网，由 awu-web 访问
    expose:
      - "44321"
      - "44322"
    networks:
      - awu-internal

  awu-web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    image: agent-with-u-web:latest
    container_name: awu-web
    restart: unless-stopped
    depends_on:
      - awu-backend

    # ★ 映射到宿主端口，NPM 用「NAS局域网IP : 44380」路由进来。
    #   把 44380 改成你 NAS 上【空闲】的端口（80 被占就别用 80）。
    #   只暴露给局域网即可，无需公网。
    ports:
      - "44380:80"

    networks:
      - awu-internal      # 访问 awu-backend

volumes:
  awu-data:

networks:
  awu-internal:
    driver: bridge
